<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yêu cầu đặt lại mật khẩu</title>
</head>
<body style="margin:0;padding:0;background-color:#f5ede8;font-family:'Helvetica Neue',Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5ede8;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0"
          style="background:#ffffff;border-radius:12px;overflow:hidden;max-width:520px;width:100%;">

          <tr>
            <td style="background-color:#5a1a10;padding:32px 32px 24px;text-align:center;">
              <h1 style="color:#f5ede8;font-size:20px;font-weight:600;margin:0;letter-spacing:0.3px;">
                Nekusora Cinema
              </h1>
            </td>
          </tr>

          <tr>
            <td style="padding:32px 32px 24px;">
              <p style="color:#4a3020;font-size:14px;line-height:1.6;margin:0 0 24px;">
                Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản của bạn. Vui lòng sử dụng mã OTP dưới đây để tiếp tục.
              </p>

              <table width="100%" cellpadding="0" cellspacing="0"
                style="background:#f5ede8;border:1.5px solid #c08060;border-radius:10px;margin:0 0 24px;">
                <tr>
                  <td style="padding:20px;text-align:center;">
                    <p style="color:#7a4020;font-size:12px;font-weight:600;
                               letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px;">
                      Mã OTP
                    </p>
                    <p style="color:#5a1a10;font-size:38px;font-weight:700;
                               letter-spacing:12px;font-family:'Courier New',monospace;margin:0;">
                      {{ otp_code }}
                    </p>
                  </td>
                </tr>
              </table>

              <hr style="border:none;border-top:1px solid #e8d5c8;margin:20px 0;">

              <table width="100%" cellpadding="0" cellspacing="0"
                style="background:#fdf3ee;border-left:3px solid #c06040;
                       border-radius:0 6px 6px 0;margin:0 0 20px;">
                <tr>
                  <td style="padding:12px 16px;">
                    <p style="color:#6a3020;font-size:13px;margin:0;line-height:1.5;">
                      <strong>Lưu ý: </strong>
                      Mã OTP có hiệu lực trong vòng <strong>5 phút</strong>. Vui lòng không chia sẻ mã này với bất kỳ ai.
                    </p>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <tr>
            <td style="background:#f0e0d5;padding:16px 32px;
                       text-align:center;border-top:1px solid #e0c8b8;">
              <p style="color:#8a6050;font-size:12px;margin:0;line-height:1.6;">
                Vui lòng không trả lời email này
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
